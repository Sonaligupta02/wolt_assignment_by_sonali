version: 2

models:
  - name: fct_order_items
    description: >
      Analytics-ready fact table at the grain of one purchased item
      within an order.

    columns:
      - name: purchase_key
        description: Unique identifier of the purchase/order.
        data_tests:
          - not_null

      - name: customer_key
        description: Unique identifier of the customer.
        data_tests:
          - not_null

      - name: item_key
        description: Unique identifier of the purchased item.
        data_tests:
          - not_null

      - name: order_received_at
        description: Timestamp when the order was received.
        data_tests:
          - not_null

      - name: quantity
        description: Number of units of the item purchased.
        data_tests:
          - not_null

      - name: is_on_promotion
        description: Indicates whether the item was purchased during an active promotion.
        data_tests:
          - not_null

      - name: discount_percentage
        description: Discount percentage applicable to the item.
        data_tests:
          - not_null
